name: Chromium website QA

on:
  pull_request:
  push:
    branches:
      - main
      - website-rebuild-v33

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop, tablet, and mobile Chromium QA
        run: pnpm run test:chromium

      - name: Upload page screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-screenshots
          path: test-results/
          if-no-files-found: error
          retention-days: 14
